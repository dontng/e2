<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词 · 口译过一屏</title>
<style>
:root {
  --bg: #f6f3ec; --paper: #fcfaf4; --ink: #34302a; --sub: #948c7d;
  --line: #e6dfd0; --akane: #a13c3c; --moss: #5e7a58;
  --strong-ink: #2c2a25; --en-ink: #46413a; --footer-ink: #c4bcab;
  --tape: #cdbfa6; --tape-revealed: #6a6356;
  --halo: rgba(246,243,236,.96); --halo0: rgba(246,243,236,0);
}
/* 和纸夜版：与句子台同一套暗色 */
:root[data-theme="dark"] {
  --bg: #1a1613; --paper: #241f1a; --ink: #e7ddcc; --sub: #9a8e7c;
  --line: #39322b; --akane: #d77f72; --moss: #8bb079;
  --strong-ink: #f1e8d7; --en-ink: #d8cdba; --footer-ink: #5e5547;
  --tape: #4a4036; --tape-revealed: #b3a895;
  --halo: rgba(36,31,26,.95); --halo0: rgba(36,31,26,0);
}
html { transition: background-color .35s ease; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: var(--bg); color: var(--ink);
  font-family: "Hiragino Sans GB", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  font-size: 15px; line-height: 1.8; letter-spacing: .02em; }
.wrap { max-width: 640px; margin: 0 auto; padding: 48px 26px 80px; }

header { display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.kicker { font-size: 10px; letter-spacing: .42em; color: var(--sub); }
h1 { font-family: "Hiragino Mincho ProN", "Noto Serif CJK SC", serif;
  font-size: 21px; font-weight: 600; letter-spacing: .14em; margin-top: 4px; }
.count { font-family: Georgia, serif; font-size: 13px; color: var(--sub); }
.count b { font-size: 26px; color: var(--akane); }

.w { padding: 20px 0; border-top: 1px solid var(--line); }
.w:first-child { border-top: none; }
.wh { font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
.wh b { color: var(--strong-ink); font-weight: 600; }
.wh i { color: var(--sub); font-size: 12.5px; font-style: normal; margin-left: 8px;
  letter-spacing: .05em; }
.s { font-family: Georgia, "Times New Roman", serif; font-size: 15px; line-height: 1.7;
  color: var(--en-ink); margin-top: 9px; padding-left: 14px; border-left: 2px solid var(--line); }

.tape { cursor: pointer; border-radius: 3px; padding: 0 8px; margin-left: 10px;
  color: transparent; user-select: none; font-family: "Hiragino Sans GB", "PingFang SC", sans-serif;
  font-size: 13.5px; letter-spacing: .03em; white-space: nowrap;
  background: var(--tape);
  background-image: repeating-linear-gradient(45deg,
    rgba(255,255,255,.18) 0 4px, rgba(0,0,0,.015) 4px 8px);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
  transition: color .18s, background .18s, box-shadow .18s; }
.tape:empty { display: none; }
.tape.off, .revealed .tape {
  color: var(--tape-revealed); background: none; background-image: none; box-shadow: none; cursor: default; }
.wh .tape { font-size: 14px; }

.bar { position: sticky; bottom: 0; margin-top: 40px; padding: 18px 0 6px;
  display: flex; gap: 14px; align-items: center;
  background: linear-gradient(transparent, var(--bg) 28%); }
button { font: inherit; font-size: 13.5px; letter-spacing: .16em; cursor: pointer;
  padding: 9px 26px; color: var(--moss); background: none;
  border: 1px solid var(--moss); border-radius: 4px; transition: all .25s; }
button:hover { background: var(--moss); color: var(--paper); }
button.quiet { border-color: var(--line); color: var(--sub); padding: 8px 18px; }
button.quiet:hover { background: none; border-color: var(--sub); color: var(--ink); }
.hint { margin-left: auto; font-size: 12.5px; color: var(--sub); }
.done { text-align: center; padding: 60px 0; color: var(--sub); font-size: 15px; line-height: 2.2; }
.done b { color: var(--moss); }
.navlink { display: inline-block; margin-top: 7px; font-size: 12px; letter-spacing: .18em;
  color: var(--moss); text-decoration: none; border-bottom: 1px solid var(--line); }
.navlink:hover { border-color: var(--moss); }
footer { margin-top: 50px; text-align: center; font-size: 11px;
  color: var(--footer-ink); letter-spacing: .35em; }

/* 深色模式开关：左下角悬浮的手绘日/月（与句子台同款） */
.theme-toggle { position: fixed; left: 20px; bottom: 18px; z-index: 40;
  width: 60px; height: 60px; padding: 0; border: none; cursor: pointer;
  color: var(--sub); display: grid; place-items: center; border-radius: 50%;
  background: radial-gradient(circle, var(--halo) 56%, var(--halo0) 76%);
  transition: transform .15s cubic-bezier(.34,1.56,.64,1), color .2s, opacity .15s; }
.theme-toggle svg { width: 40px; height: 40px; display: block; overflow: visible;
  filter: url(#sketch); transition: transform .2s ease; }
.theme-toggle:hover { color: var(--akane); }
.theme-toggle:hover svg { transform: rotate(-14deg) scale(1.08); }
.theme-toggle.press { transform: scale(.72) translateY(3px); opacity: .55;
  color: var(--akane); transition-duration: .08s; }
</style>
<script>
/* 预着色：首帧前定明暗，避免白闪。优先本机记忆，否则跟随系统。 */
(function () {
  try {
    var t = localStorage.getItem('studio-theme');
    if (!t || t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="kicker">SIGHT · TRANSLATE</div><h1>单词</h1>
      <a class="navlink" href="http://127.0.0.1:8787">句子 ↗</a></div>
    <div class="count" id="count">—</div>
  </header>

  <div id="list"></div>

  <div class="bar" id="bar"></div>
  <footer>口译过一屏 · 揭胶带对一眼 · 不问会不会</footer>
</div>
<button id="theme-toggle" class="theme-toggle" aria-label="深色模式开关" onclick="toggleTheme()"></button>

<!-- 手绘抖动滤镜 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="sketch">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let shown = [];     // 当前屏的词 key

// —— 深色模式：手绘日/月开关 + 后端同步（与句子台共享偏好） ——
const THEME_ICON = {
  moon: '<path d="M38 13 A 20 20 0 1 0 38 51 A 15 15 0 1 1 38 13 Z" fill="currentColor" stroke="none"/>',
  sun:  '<circle cx="32" cy="32" r="9"/><path d="M32 7 L32 15 M32 49 L32 57 M7 32 L15 32'
      + ' M49 32 L57 32 M15 15 L20 20 M44 44 L49 49 M49 15 L44 20 M15 49 L20 44"/>',
};
const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
function paintThemeBtn() {
  const b = $('theme-toggle'); if (!b) return;
  b.setAttribute('aria-label', isDark() ? '切到亮色' : '切到暗色');
  b.innerHTML = `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2"`
    + ` stroke-linecap="round" stroke-linejoin="round">${isDark() ? THEME_ICON.sun : THEME_ICON.moon}</svg>`;
}
function applyTheme(t, persist) {
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  paintThemeBtn();
  if (persist) {
    try { localStorage.setItem('studio-theme', t); } catch (e) {}
    fetch('/api/theme', { method: 'POST', body: JSON.stringify({ theme: t }) }).catch(() => {});
  }
}
function toggleTheme() {
  const b = $('theme-toggle'); b.classList.add('press');
  setTimeout(() => { b.classList.remove('press'); applyTheme(isDark() ? 'light' : 'dark', true); }, 140);
}
paintThemeBtn();

function tape(zh) { return zh ? `<span class="tape" onclick="this.classList.toggle('off')">${esc(zh)}</span>` : ''; }

function render(s) {
  if (s.theme && s.theme !== 'auto') applyTheme(s.theme, false);   // 跨页同步：服务端为准
  shown = s.words.map(w => w.word.toLowerCase());
  $('count').innerHTML = `<b>${s.remaining}</b> 待复习 / ${s.total}`;
  $('list').classList.remove('revealed');

  if (!s.words.length) {
    $('list').innerHTML = `<div class="done">这一轮的词都过完了 ·<br><b>待会儿再来一屏</b></div>`;
    $('bar').innerHTML = `<button class="quiet" onclick="load()">刷新</button>
      <span class="hint">间隔到了会自动再现</span>`;
    return;
  }

  $('list').innerHTML = s.words.map(w => `
    <div class="w">
      <div class="wh"><b>${esc(w.word)}</b><i>${esc(w.pos)}</i>${tape(w.gloss)}</div>
      ${w.sentences.map(se => `<div class="s">${esc(se.en)}${tape(se.zh)}</div>`).join('')}
    </div>`).join('');

  $('bar').innerHTML = `
    <button onclick="next()">又来一屏 ⟳</button>
    <button class="quiet" onclick="$('list').classList.toggle('revealed')">揭开整屏</button>
    <span class="hint">先口译，再揭胶带对一眼</span>`;
}

async function load() {
  render(await (await fetch('/api/screen')).json());
  scrollTo(0, 0);
}

async function next() {
  const r = await fetch('/api/done', { method: 'POST', body: JSON.stringify({ keys: shown }) });
  render(await r.json());
  scrollTo(0, 0);
}

load();

// 跨页主题实时同步：每 4 秒轮询后端，与句子台保持一致
let _lastTheme = '';
setInterval(async () => {
  try {
    const { theme } = await (await fetch('/api/theme')).json();
    if (theme && theme !== 'auto' && theme !== _lastTheme) {
      _lastTheme = theme;
      applyTheme(theme, false);
    }
  } catch (e) {}
}, 4000);
</script>
</body>
</html>

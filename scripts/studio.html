<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日一句 · studio</title>
<style>
:root {
  --bg: #f6f3ec;
  --paper: #fcfaf4;
  --ink: #34302a;
  --sub: #948c7d;
  --line: #e6dfd0;
  --akane: #a13c3c;
  --ai: #3c5a78;
  --moss: #5e7a58;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Hiragino Sans GB", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  font-size: 15px; line-height: 2; letter-spacing: .03em;
}
.layout { max-width: 1280px; margin: 0 auto; padding: 42px 36px 90px;
          display: grid; grid-template-columns: 184px 340px 1fr; gap: 44px; }
@media (max-width: 1040px) { .layout { grid-template-columns: 1fr; gap: 12px; padding: 28px 22px 70px; } }
aside { position: sticky; top: 38px; align-self: start; }
aside.track > section:first-child { margin-top: 0; }
@media (max-width: 1040px) { aside { position: static; padding-bottom: 14px;
         border-bottom: 1px solid var(--line); margin-bottom: 6px; } }
main { min-width: 0; }
.kicker { font-size: 10px; letter-spacing: .42em; color: var(--sub); }
h1 { font-family: "Hiragino Mincho ProN", "Noto Serif CJK SC", "Source Han Serif SC", serif;
     font-size: 22px; font-weight: 600; letter-spacing: .14em; margin-top: 4px; }
.navlink { margin-top: 8px; }
.dday { margin: 22px 0 2px; padding-top: 20px; border-top: 1px solid var(--line);
        font-family: Georgia, serif; line-height: 1; }
.dday b { font-size: 36px; font-weight: 600; color: var(--akane); }
.dday i { font-style: normal; font-size: 12px; color: var(--akane); margin-left: 4px; }
.dday em { display: block; font-style: normal; margin-top: 8px;
           font-family: inherit; font-size: 11px; color: var(--sub); letter-spacing: .3em; }

section { margin-top: 48px; }
main > section:first-child { margin-top: 2px; }
aside > section { margin-top: 32px; }
.stitle { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.stitle::before { content: ""; align-self: center; width: 3px; height: 15px; background: var(--akane); }
.stitle h2 { font-family: "Hiragino Mincho ProN", "Noto Serif CJK SC", serif;
             font-size: 16px; font-weight: 600; letter-spacing: .2em; }
.stitle small { color: var(--sub); font-size: 12px; letter-spacing: .1em; }

.en { font-family: Georgia, "Times New Roman", serif; font-size: 16px; line-height: 1.85;
      color: #46413a; padding: 4px 0 4px 18px; border-left: 2px solid var(--line); }

textarea {
  width: 100%; min-height: 104px; margin-top: 14px; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 5px; background: var(--paper);
  font: inherit; color: var(--ink); resize: vertical; transition: border-color .25s;
}
textarea:focus { outline: none; border-color: var(--ai); }
textarea::placeholder { color: #c0b8a8; }

.row { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 12px; }
.hint { font-size: 12.5px; color: var(--sub); margin-right: auto; }
button {
  font: inherit; font-size: 13.5px; letter-spacing: .18em; cursor: pointer;
  padding: 7px 26px; color: var(--ai); background: none;
  border: 1px solid var(--ai); border-radius: 4px; transition: all .25s;
}
button:hover { background: var(--ai); color: var(--paper); }
button.quiet { border-color: var(--line); color: var(--sub); padding: 5px 18px; }
button.quiet:hover { background: none; border-color: var(--sub); color: var(--ink); }
button:disabled { opacity: .4; pointer-events: none; }

.waiting { display: flex; align-items: center; gap: 10px; margin-top: 16px;
           font-size: 13.5px; color: var(--sub); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--akane);
         animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

.md { margin-top: 18px; font-size: 14.5px; }
.md p { margin: .6em 0; }
.md pre { background: var(--paper); border: 1px solid var(--line); border-radius: 5px;
          padding: 12px 16px; margin: .8em 0; white-space: pre-wrap;
          font-family: Georgia, serif; font-size: 14.5px; line-height: 1.8; }
.md code { background: var(--paper); border: 1px solid var(--line); border-radius: 3px;
           padding: 0 5px; font-family: Georgia, serif; font-size: 13.5px; }
.md blockquote { border-left: 2px solid var(--line); padding-left: 16px; color: #5c564c;
                 font-family: Georgia, serif; margin: .6em 0; }
.md ul { padding-left: 1.3em; margin: .5em 0; }
.md b { color: #2c2a25; }
.score-detail ul { margin: .3em 0; }
.score-detail li { margin: .15em 0; }

.scorebig { display: flex; align-items: baseline; gap: 8px; margin-top: 18px;
            font-family: Georgia, serif; }
.scorebig b { font-size: 40px; font-weight: 600; color: var(--akane); }
.scorebig.good b { color: var(--moss); }
.scorebig span { color: var(--sub); font-size: 15px; }

.mine { margin-top: 16px; padding: 12px 16px; background: var(--paper);
        border: 1px solid var(--line); border-radius: 5px; color: #57514a; font-size: 14.5px; }
.mine label { display: block; font-size: 11px; color: var(--sub); letter-spacing: .25em; margin-bottom: 4px; }

.redo-card { padding: 26px 0; border-top: 1px solid var(--line); }
.redo-card:first-of-type { border-top: none; padding-top: 6px; }
.redo-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.redo-head .tag { font-family: Georgia, serif; font-size: 13px; color: var(--sub); letter-spacing: .12em; }
.done-mark { font-size: 12px; color: var(--moss); letter-spacing: .2em; }

#heat { margin-top: 6px; overflow-x: auto; }
#heat svg { display: block; }
.hm-d { rx: 2px; }
.hm-n { fill: #ebe4d6; }            /* 没练 */
.hm-0 { fill: #d6e2cb; }            /* 练了未批改 */
.hm-1 { fill: #bcd3ab; }
.hm-2 { fill: #94b884; }
.hm-3 { fill: #6f9963; }
.hm-4 { fill: var(--moss); }
.hm-d.today { stroke: var(--akane); stroke-width: 1.4px; }
.hm-label { font-family: Georgia, serif; font-size: 9px; fill: var(--sub); }
.hm-legend { display: flex; align-items: center; justify-content: flex-end;
             gap: 5px; margin-top: 8px; font-size: 11px; color: var(--sub); }
.hm-legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
th { font-weight: 400; font-size: 10px; color: var(--sub); letter-spacing: .12em;
     text-align: left; padding: 5px 3px; border-bottom: 1px solid var(--line); }
td { padding: 5px 3px; border-bottom: 1px solid #efe9dc;
     font-variant-numeric: tabular-nums; }
td.num { font-family: Georgia, serif; }
.up { color: var(--moss); } .down { color: var(--akane); }
.dash { color: #c8c0b0; }

#toast { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%) translateY(80px);
         background: var(--ink); color: var(--paper); font-size: 13.5px; letter-spacing: .1em;
         padding: 10px 28px; border-radius: 4px; opacity: 0; transition: all .35s; }
#toast.show { opacity: .96; transform: translateX(-50%); }
.ghlink { font-size: 12px; color: var(--sub); text-decoration: none; letter-spacing: .15em;
          border-bottom: 1px solid var(--line); }
.ghlink:hover { color: var(--ai); border-color: var(--ai); }
button.doc-btn { background: none; border: none; border-bottom: 1px solid var(--line);
                 padding: 0; cursor: pointer; font: inherit; font-size: 12px; }
#sec-doc .stitle button.doc-btn { margin-left: auto; }
.md h3 { font-size: 15px; margin: 20px 0 8px; }
.md h4 { font-size: 13.5px; color: var(--sub); margin: 15px 0 6px; letter-spacing: .04em; }
.md hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
.navlink { display: inline-block; margin-top: 7px; font-size: 12px; letter-spacing: .18em;
           color: var(--ai); text-decoration: none; border-bottom: 1px solid var(--line); }
.navlink:hover { border-color: var(--ai); }

/* 翻日导航：右栏顶部一左一右的手绘大箭头，sticky 悬浮、滚动时浮在正文之上不被遮 */
#day-nav { position: sticky; top: 4px; z-index: 30; display: flex;
           justify-content: space-between; align-items: center;
           height: 50px; margin: -6px -10px 2px; pointer-events: none; }
#day-nav[hidden] { display: none; }
.dayarrow { pointer-events: auto; width: 54px; height: 54px; padding: 0; border: none;
            cursor: pointer; color: var(--sub); display: grid; place-items: center;
            border-radius: 50%; background: radial-gradient(circle,
              rgba(246,243,236,.94) 58%, rgba(246,243,236,0) 74%);
            transition: transform .15s cubic-bezier(.34,1.56,.64,1), color .2s, opacity .15s; }
.dayarrow svg { width: 48px; height: 48px; display: block; overflow: visible;
                filter: url(#sketch); transition: transform .15s ease; }
.dayarrow:hover { color: var(--akane); }
.dayarrow.left:hover svg  { transform: translateX(-3px) scale(1.05); }
.dayarrow.right:hover svg { transform: translateX(3px) scale(1.05); }
.dayarrow.press { transform: scale(.72) translateY(3px); opacity: .5;
                  color: var(--akane); transition-duration: .08s; }
.dayarrow.gone { visibility: hidden; pointer-events: none; }
footer { margin-top: 80px; text-align: center; font-size: 11px;
         color: #c4bcab; letter-spacing: .4em; }
</style>
</head>
<body>
<div class="layout">
  <aside class="rail">
    <div class="kicker">ENGLISH II · DAILY</div>
    <h1>每日一句</h1>
    <a class="navlink" href="http://127.0.0.1:8788">单词 ↗</a>
    <div class="dday"><b id="days-left">—</b><i>天</i><em>距考试</em></div>
  </aside>

  <aside class="track">
    <section>
      <div class="stitle"><h2>坚持</h2><small id="chart-sub"></small></div>
      <div id="heat"></div>
      <table id="score-table"></table>
    </section>
  </aside>

  <main>
    <div id="day-nav" hidden></div>
    <section id="sec-today"></section>
    <section id="sec-redo"></section>
    <section id="sec-doc" hidden></section>
    <footer>静水流深 · 不积跬步无以至千里</footer>
  </main>
</div>
<div id="toast"></div>

<!-- 手绘抖动滤镜：把规整的箭头描边扰成铅笔手绘的味道 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="sketch">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<script>
let prev = '';
let MODE = 'local';

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function md(src) {
  let h = esc(src);
  h = h.replace(/```([\s\S]*?)```/g, (_, c) => '<pre>' + c.trim() + '</pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^#{2,} (.*)$/gm, '<h4>$1</h4>');
  h = h.replace(/^# (.*)$/gm, '<h3>$1</h3>');
  h = h.replace(/^---+$/gm, '<hr>');
  h = h.replace(/^&gt; ?(.*)$/gm, '<blockquote>$1</blockquote>');
  h = h.replace(/^[-•] (.*)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)(?=\n(?!<li>)|$)/g, '<ul>$1</ul>');
  return h.split(/\n{2,}/).map(p =>
    /^<(pre|blockquote|ul|h3|h4|hr)/.test(p.trim()) ? p : '<p>' + p.replace(/\n/g, '<br>') + '</p>'
  ).join('');
}

let docView = null;     // null=日卡视图 | 'fool' | 'probe'
let docStem = '';       // 当前 doc 所属的天（返回时回到这天）
let curDay  = null;     // null=今日(可编辑) | stem=正在翻阅的历史某天(只读)
let lastState = null;   // 最近一次 /api/state
let TODAY_STEM = '';    // 今天的 stem

// 把右栏三段的显隐切到某种视图
function showOnly(which) {   // 'day' | 'doc'
  $('sec-doc').hidden   = which !== 'doc';
  $('sec-today').hidden = which === 'doc';
  $('sec-redo').hidden  = which === 'doc';
}

// —— 手绘翻日箭头 ——
const ARROW = {
  left:  '<path d="M40 16 C 30 26,22 31,17 36 C 22 41,30 46,40 56"/><path d="M18 36 C 32 35,46 36,57 35.5"/>',
  right: '<path d="M32 16 C 42 26,50 31,55 36 C 50 41,42 46,32 56"/><path d="M54 36 C 40 35,26 36,15 35.5"/>',
};
function arrowBtn(dir, stem) {
  return `<button class="dayarrow ${dir} ${stem ? '' : 'gone'}" aria-label="${dir === 'left' ? '前一天' : '后一天'}"`
       + ` onclick="navDay('${stem}', this)"><svg viewBox="0 0 72 72" fill="none" stroke="currentColor"`
       + ` stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">${ARROW[dir]}</svg></button>`;
}
// 顶部一左一右；缺的一侧隐藏但保留位置，另一侧仍贴边。doc 视图里整条不显示。
function renderDayNav(prevStem, nextStem) {
  const el = $('day-nav');
  if (docView) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = arrowBtn('left', prevStem || '') + arrowBtn('right', nextStem || '');
}

function navDay(stem, btn) {
  if (!stem) return;
  btn.classList.add('press');                  // 下沉反馈
  setTimeout(() => { btn.classList.remove('press'); gotoDay(stem); }, 160);
}
// 切到某天：今天→回到可编辑今日卡；其它→拉取只读历史卡。
function gotoDay(stem) {
  docView = null;
  if (!stem || stem === TODAY_STEM) { curDay = null; if (lastState) render(lastState); return; }
  curDay = stem;
  fetch('/api/day?d=' + encodeURIComponent(stem)).then(r => r.json()).then(d => {
    if (curDay !== stem || docView) return;     // 期间又切走了
    renderDayView(d);
  });
}

// fool/probe/SRC 入口（今日卡与历史卡共用）
function docLinks(t) {
  return [
    t.gh ? `<a class="ghlink" href="${t.gh}" target="_blank">SRC</a>` : '',
    t.has_fool ? `<button class="ghlink doc-btn" onclick="showDoc('fool','${t.stem}')">FOOL</button>` : '',
    t.has_probe ? `<button class="ghlink doc-btn" onclick="showDoc('probe','${t.stem}')">PROBE</button>` : '',
  ].filter(Boolean).join('　');
}

// 只读渲染历史某天整张卡（原句/我的翻译/评分/批改 + 入口）+ 该天复习块。
function renderDayView(d) {
  showOnly('day');
  renderDayNav(d.prev, d.next);
  const el = $('sec-today');
  if (!d.exists) { el.innerHTML = '<div class="hint">没有这一天</div>'; $('sec-redo').innerHTML = ''; return; }
  const title = `<div class="stitle"><h2>${d.is_today ? '今日' : '回顾'}</h2>`
              + `<small>day ${d.day} · ${d.mmdd.slice(0,2)}/${d.mmdd.slice(2)}</small></div>`;
  let body = `<div class="en">${esc((d.sentence || '').replace(/^>\s?/gm, ''))}</div>`;
  if (d.translation) body += `<div class="mine"><label>我的翻译</label>${esc(d.translation)}</div>`;
  if (d.correction) body += scoreBig(d.score) + refBox(d.correction);
  else body += '<div class="hint" style="margin-top:14px">这天还没有批改</div>';
  const links = docLinks(d);
  if (links) body += `<div class="row" style="justify-content:flex-start">${links}</div>`;
  el.innerHTML = title + body;
  renderRedoView(d.redo_blocks || []);
}

// 历史天的复习块：只读
function renderRedoView(blocks) {
  const el = $('sec-redo');
  if (!blocks.length) { el.innerHTML = ''; return; }
  let h = `<div class="stitle"><h2>复习</h2><small>当日盲译重做</small></div>`;
  for (const b of blocks) {
    h += `<div class="redo-card"><div class="redo-head"><span class="tag">day ${b.day} · ${b.date}</span>
          ${b.feedback ? '<span class="done-mark">済</span>' : ''}</div>
          <div class="en">${esc(b.sentence.replace(/^>\s?/gm, ''))}</div>`;
    if (b.redo) h += `<div class="mine"><label>我的重译</label>${esc(b.redo)}</div>`;
    if (b.feedback) h += `<div class="md">${md(b.feedback)}</div>`;
    if (!b.redo && !b.feedback) h += '<div class="hint">未重译</div>';
    h += `</div>`;
  }
  el.innerHTML = h;
}

// 整个右栏切到某天的 fool/probe 正文；顶部「← 返回」回到来时那天。
function showDoc(kind, stem) {
  docView = kind; docStem = stem || TODAY_STEM;
  showOnly('doc');
  renderDayNav();                       // doc 视图隐藏翻日箭头
  const sec = $('sec-doc');
  sec.innerHTML = docHead(kind) + '<div class="hint">载入中…</div>';
  fetch('/api/' + kind + (stem ? '?d=' + encodeURIComponent(stem) : '')).then(r => r.json()).then(d => {
    if (docView !== kind) return;        // 期间已返回/切换
    sec.innerHTML = docHead(kind) + (d.md
      ? `<div class="md">${md(d.md)}</div>`
      : '<div class="hint">这天没有内容</div>');
  });
}
function docHead(kind) {
  return `<div class="stitle"><h2>${kind === 'fool' ? '愚者 Fool' : '探针 Probe'}</h2>`
       + `<button class="ghlink doc-btn" onclick="backDoc()">← 返回</button></div>`;
}
function backDoc() { docView = null; gotoDay(docStem); }

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

async function post(url, body = {}) {
  const r = await fetch(url, { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  toast(j.msg || (j.ok ? '完成' : '失败'));
  setTimeout(refresh, 600);
  return j;
}

function saveBox(kind, value, placeholder, extra = {}) {
  const id = 'ta-' + kind + (extra.day || '');
  return `
    <textarea id="${id}" placeholder="${placeholder}">${esc(value || '')}</textarea>
    <div class="row">
      <span class="hint">${extra.hint || ''}</span>
      <button onclick="save('${kind}','${id}',${extra.day || 'null'})">保 存</button>
    </div>`;
}

async function save(kind, taId, day) {
  const content = $(taId).value;
  if (!content.trim()) { toast('还没写呢'); return; }
  await post('/api/save', { kind, content, day });
}

function scoreBig(scoreText) {
  const m = scoreText.match(/\*\*([\d.]+)\s*\/\s*10\*\*/);
  if (!m) return '';
  const v = parseFloat(m[1]);
  const rest = scoreText.replace(/\*\*[\d.]+\s*\/\s*10\*\*/, '').replace(/用户/g, '你').trim();
  return `<div class="scorebig ${v >= 6 ? 'good' : ''}"><b>${m[1]}</b><span>/ 10</span></div>`
       + (rest ? `<div class="md score-detail">${md(rest)}</div>` : '');
}

// 从「## 批改」块里只取参考译文（逐条解释与采分点重复，不再展示整块批改）。
function refBox(correction) {
  const m = correction.match(/\*\*参考译文[：:]*\*\*[：:]*\s*(.+)/);
  return m ? `<div class="mine ref"><label>参考译文</label>${esc(m[1].trim())}</div>` : '';
}

function renderToday(s) {
  const t = s.today;
  const el = $('sec-today');
  let title = `<div class="stitle"><h2>今日</h2><small>day ${t.day || t.next_day} · ${t.mmdd.slice(0,2)}/${t.mmdd.slice(2)}</small></div>`;

  if (!t.exists) {
    el.innerHTML = title + `
      <div class="row" style="justify-content:flex-start">
        <span class="hint">今天的文件还没创建</span>
        <button onclick="post('/api/new-day')">开启 day ${t.next_day}</button>
      </div>`;
    return;
  }
  let body = '';
  const links = docLinks(t);

  if (!t.sentence) {
    body = saveBox('sentence', '', '把田静今天的原句贴进来…');
  } else if (!t.correction) {
    body = `<div class="en">${esc(t.sentence.replace(/^>\s?/gm, ''))}</div>`;
    if (t.translation) {
      body += saveBox('translation', t.translation, '', { hint: '已保存，可继续修改 · 批改完成前有效' });
      body += `<div class="waiting"><span class="pulse"></span>${MODE === 'remote'
        ? '已推送 GitHub · Dell 接手后结果自动出现（页面每分钟同步）'
        : 'auto-review 批改中，完成后这里直接显示结果'}</div>`;
    } else {
      body += saveBox('translation', '', '写下你的理解和翻译…');
    }
  } else {
    body = `<div class="en">${esc(t.sentence.replace(/^>\s?/gm, ''))}</div>`
         + `<div class="mine"><label>我的翻译</label>${esc(t.translation)}</div>`
         + scoreBig(t.score)
         + refBox(t.correction)
         + (links ? `<div class="row" style="justify-content:flex-start">${links}</div>` : '');
  }
  el.innerHTML = title + body;
}

function renderRedo(s) {
  const el = $('sec-redo');
  const blocks = s.redo_blocks || [];
  if (!blocks.length) { el.innerHTML = ''; return; }
  let h = `<div class="stitle"><h2>复习</h2><small>盲译重做 · 每句一生两遇</small></div>`;
  for (const b of blocks) {
    h += `<div class="redo-card">
      <div class="redo-head"><span class="tag">day ${b.day} · ${b.date}</span>
        ${b.feedback ? '<span class="done-mark">済</span>' : ''}</div>
      <div class="en">${esc(b.sentence.replace(/^>\s?/gm, ''))}</div>`;
    if (b.feedback) {
      h += `<div class="mine"><label>我的重译</label>${esc(b.redo)}</div>
            <div class="md">${md(b.feedback)}</div>`;
    } else if (b.redo) {
      h += saveBox('redo', b.redo, '', { day: b.day, hint: '已保存，可继续修改' })
         + `<div class="waiting"><span class="pulse"></span>${MODE === 'remote'
           ? '已推送 · 等待 Dell 复习批改…' : '复习批改中…'}</div>`;
    } else {
      h += saveBox('redo', '', '不看旧答案，直接重译…', { day: b.day });
    }
    h += `</div>`;
  }
  el.innerHTML = h;
}

const fmtIso = dt => dt.getFullYear() + '-' +
  String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const hmLevel = sc => sc > 7 ? 4 : sc > 5 ? 3 : sc > 3 ? 2 : sc > 0 ? 1 : 0;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WINDOW_MONTHS = 5;              // 热力图滚动窗口：始终显示最近这么多个月

function renderHeatmap(s) {
  const cells = s.heatmap || {};
  const todayIso = s.today_iso;
  const today = new Date(todayIso + 'T00:00:00');

  // 起点：滚动 WINDOW_MONTHS 个月窗口——始终显示最近这么多个月，月份到了自动前移。
  let start = new Date(today.getFullYear(), today.getMonth() - (WINDOW_MONTHS - 1), 1);
  start.setDate(start.getDate() - start.getDay());      // 回退到周日

  // 连续天数（从今天往回数有练习的日子）
  let streak = 0;
  for (let d = new Date(today); ; d.setDate(d.getDate() - 1)) {
    if (cells[fmtIso(d)] !== undefined) streak++; else break;
  }
  $('chart-sub').textContent = `共 ${s.total} 句` + (streak ? ` · 连续 ${streak} 天` : '');

  const CELL = 12, GAP = 3, STEP = CELL + GAP, TOP = 14, LEFT = 28;
  let rects = '', months = '';
  let wi = 0, lastMonth = -1;
  for (let d = new Date(start); d <= today; wi++) {
    const x = LEFT + wi * STEP;
    if (d.getMonth() !== lastMonth) {             // 该列首日跨入新月份 → 月份标签
      lastMonth = d.getMonth();
      months += `<text class="hm-label" x="${x}" y="9">${MONTHS[lastMonth]}</text>`;
    }
    for (let di = 0; di < 7; di++) {
      if (d <= today) {
        const iso = fmtIso(d);
        const sc = cells[iso];
        const cls = sc === undefined ? 'hm-n' : 'hm-' + hmLevel(sc);
        const here = iso === todayIso ? ' today' : '';
        const tip = sc === undefined ? iso + ' · 未练'
          : iso + (sc > 0 ? ` · ${sc} 分` : ' · 待批改');
        rects += `<rect class="hm-d ${cls}${here}" x="${x}" y="${TOP + di * STEP}" `
               + `width="${CELL}" height="${CELL}"><title>${tip}</title></rect>`;
      }
      d.setDate(d.getDate() + 1);
    }
  }
  const W = LEFT + wi * STEP, H = TOP + 7 * STEP;
  const wd = [['Mon', 1], ['Wed', 3], ['Fri', 5]].map(([t, r]) =>
    `<text class="hm-label" x="0" y="${TOP + r * STEP + 9}">${t}</text>`).join('');
  $('heat').innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${months}${wd}${rects}</svg>`
    + `<div class="hm-legend">少 <i class="hm-n" style="background:#ebe4d6"></i>`
    + `<i style="background:#bcd3ab"></i><i style="background:#94b884"></i>`
    + `<i style="background:#6f9963"></i><i style="background:#5e7a58"></i> 多</div>`;
}

function renderTable(s) {
  const rows = s.rows || [];
  if (!rows.length) { $('score-table').innerHTML = ''; return; }
  let h = '<tr><th>DAY</th><th>日期</th><th>首译</th><th>重译</th></tr>';
  for (const r of rows) {
    const redo = r.redos.map(x =>
      `<span class="${x.trend === '↑' ? 'up' : x.trend === '↓' ? 'down' : ''}">${x.score}${x.trend}</span>`
    ).join(' · ') || '<span class="dash">—</span>';
    h += `<tr><td class="num">${r.day}</td><td>${r.date}</td>
          <td class="num">${r.first || '<span class="dash">—</span>'}</td><td class="num">${redo}</td></tr>`;
  }
  $('score-table').innerHTML = h;
}

function render(s) {
  MODE = s.mode; lastState = s;
  TODAY_STEM = (s.today && s.today.stem) || '';
  $('days-left').textContent = s.days_left;
  renderHeatmap(s); renderTable(s);            // 侧栏始终跟随最新状态
  if (docView) { showOnly('doc'); renderDayNav(); return; }   // 正在看 fool/probe，不打断
  if (curDay)  { return; }                     // 正在翻阅历史某天，主栏交给 day_view，不覆盖
  showOnly('day');                             // 今日可编辑视图
  renderToday(s); renderRedo(s);
  renderDayNav(s.today.prev, s.today.next);
}

async function refresh() {
  const r = await fetch('/api/state');
  const s = await r.json();
  const sig = JSON.stringify(s);
  if (sig === prev) { lastState = s; return; }
  if (document.activeElement && document.activeElement.tagName === 'TEXTAREA'
      && document.activeElement.value.trim()) return;   // 正在打字，不打断
  prev = sig;
  render(s);
}

// 键盘左右键 = 点击对应箭头（复用下沉动效）；打字、看 doc 时不响应
document.addEventListener('keydown', e => {
  if (docView) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT')) return;
  if (e.key === 'ArrowLeft')  $('day-nav').querySelector('.dayarrow.left:not(.gone)')?.click();
  if (e.key === 'ArrowRight') $('day-nav').querySelector('.dayarrow.right:not(.gone)')?.click();
});

refresh();
setInterval(refresh, 8000);
</script>

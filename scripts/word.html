<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词 · 口译过一屏</title>
<style>
:root {
  --bg: #f6f3ec; --paper: #fcfaf4; --ink: #34302a; --sub: #948c7d;
  --line: #e6dfd0; --akane: #a13c3c; --moss: #5e7a58;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: var(--bg); color: var(--ink);
  font-family: "Hiragino Sans GB", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  font-size: 15px; line-height: 1.8; letter-spacing: .02em; }
.wrap { max-width: 640px; margin: 0 auto; padding: 48px 26px 80px; }

header { display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.kicker { font-size: 10px; letter-spacing: .42em; color: var(--sub); }
h1 { font-family: "Hiragino Mincho ProN", "Noto Serif CJK SC", serif;
  font-size: 21px; font-weight: 600; letter-spacing: .14em; margin-top: 4px; }
.count { font-family: Georgia, serif; font-size: 13px; color: var(--sub); }
.count b { font-size: 26px; color: var(--akane); }

.w { padding: 20px 0; border-top: 1px solid var(--line); }
.w:first-child { border-top: none; }
.wh { font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
.wh b { color: #2c2a25; font-weight: 600; }
.wh i { color: var(--sub); font-size: 12.5px; font-style: normal; margin-left: 8px;
  letter-spacing: .05em; }
.s { font-family: Georgia, "Times New Roman", serif; font-size: 15px; line-height: 1.7;
  color: #46413a; margin-top: 9px; padding-left: 14px; border-left: 2px solid var(--line); }

.tape { cursor: pointer; border-radius: 3px; padding: 0 8px; margin-left: 10px;
  color: transparent; user-select: none; font-family: "Hiragino Sans GB", "PingFang SC", sans-serif;
  font-size: 13.5px; letter-spacing: .03em; white-space: nowrap;
  background: #cdbfa6;
  background-image: repeating-linear-gradient(45deg,
    rgba(255,255,255,.18) 0 4px, rgba(0,0,0,.015) 4px 8px);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
  transition: color .18s, background .18s, box-shadow .18s; }
.tape:empty { display: none; }
.tape.off, .revealed .tape {
  color: #6a6356; background: none; background-image: none; box-shadow: none; cursor: default; }
.wh .tape { font-size: 14px; }

.bar { position: sticky; bottom: 0; margin-top: 40px; padding: 18px 0 6px;
  display: flex; gap: 14px; align-items: center;
  background: linear-gradient(transparent, var(--bg) 28%); }
button { font: inherit; font-size: 13.5px; letter-spacing: .16em; cursor: pointer;
  padding: 9px 26px; color: var(--moss); background: none;
  border: 1px solid var(--moss); border-radius: 4px; transition: all .25s; }
button:hover { background: var(--moss); color: var(--paper); }
button.quiet { border-color: var(--line); color: var(--sub); padding: 8px 18px; }
button.quiet:hover { background: none; border-color: var(--sub); color: var(--ink); }
.hint { margin-left: auto; font-size: 12.5px; color: var(--sub); }
.done { text-align: center; padding: 60px 0; color: var(--sub); font-size: 15px; line-height: 2.2; }
.done b { color: var(--moss); }
.navlink { display: inline-block; margin-top: 7px; font-size: 12px; letter-spacing: .18em;
  color: var(--moss); text-decoration: none; border-bottom: 1px solid var(--line); }
.navlink:hover { border-color: var(--moss); }
footer { margin-top: 50px; text-align: center; font-size: 11px;
  color: #c4bcab; letter-spacing: .35em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="kicker">SIGHT · TRANSLATE</div><h1>单词</h1>
      <a class="navlink" href="http://127.0.0.1:8787">句子 ↗</a></div>
    <div class="count" id="count">—</div>
  </header>

  <div id="list"></div>

  <div class="bar" id="bar"></div>
  <footer>口译过一屏 · 揭胶带对一眼 · 不问会不会</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let shown = [];     // 当前屏的词 key

function tape(zh) { return zh ? `<span class="tape" onclick="this.classList.toggle('off')">${esc(zh)}</span>` : ''; }

function render(s) {
  shown = s.words.map(w => w.word.toLowerCase());
  $('count').innerHTML = `<b>${s.remaining}</b> 待复习 / ${s.total}`;
  $('list').classList.remove('revealed');

  if (!s.words.length) {
    $('list').innerHTML = `<div class="done">这一轮的词都过完了 ·<br><b>待会儿再来一屏</b></div>`;
    $('bar').innerHTML = `<button class="quiet" onclick="load()">刷新</button>
      <span class="hint">间隔到了会自动再现</span>`;
    return;
  }

  $('list').innerHTML = s.words.map(w => `
    <div class="w">
      <div class="wh"><b>${esc(w.word)}</b><i>${esc(w.pos)}</i>${tape(w.gloss)}</div>
      ${w.sentences.map(se => `<div class="s">${esc(se.en)}${tape(se.zh)}</div>`).join('')}
    </div>`).join('');

  $('bar').innerHTML = `
    <button onclick="next()">又来一屏 ⟳</button>
    <button class="quiet" onclick="$('list').classList.toggle('revealed')">揭开整屏</button>
    <span class="hint">先口译，再揭胶带对一眼</span>`;
}

async function load() {
  render(await (await fetch('/api/screen')).json());
  scrollTo(0, 0);
}

async function next() {
  const r = await fetch('/api/done', { method: 'POST', body: JSON.stringify({ keys: shown }) });
  render(await r.json());
  scrollTo(0, 0);
}

load();
</script>
</body>
</html>
